server:
  port: 8080

spring:
  application:
    name: space-cats-market

  datasource:
    url: jdbc:postgresql://localhost:5432/cosmocats
    username: postgres
    password: 12082006
    hikari:
      auto-commit: false
      connection-timeout: 30000
      maximum-pool-size: 10
      max-lifetime: 1800000
      pool-name: cosmocats-pool

  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 15
        order_inserts: true
        order_updates: true
        query.fail_on_pagination_over_collection_fetch: true
        query.in_clause_parameter_padding: true
        connection.provider_disables_autocommit: true
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:liquibase/db.changelog-master.yaml
    enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

clients:
  rates:
    base-url: http://localhost:8089
    connect-timeout-ms: 1000
    read-timeout-ms: 1500

application:
  greetings:
    dobby:
      name: dobby
      message: Salut from space cat ${application.greetings.dobby.name}

  payment-service:
    base-path: http://localhost:8089
    payments: ${application.payment-service.base-path}/payment-service/v1/payments

  feature:
    toggles:
      cosmo-cats: true
      kitty-products: false

tests:
  unit-tests:
    enabled: true