server:
  port: 8080

spring:
  application:
    name: space-cats-market

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

clients:
  rates:
    base-url: http://localhost:8089
    connect-timeout-ms: 1000
    read-timeout-ms: 1500

application:
  greetings:
    dobby:
      name: dobby
      message: Salut from space cat ${application.greetings.dobby.name}

  payment-service:
    base-path: http://localhost:8089
    payments: ${application.payment-service.base-path}/payment-service/v1/payments

  feature:
    toggles:
      cosmo-cats: true
      kitty-products: false

tests:
  unit-tests:
    enabled: true
