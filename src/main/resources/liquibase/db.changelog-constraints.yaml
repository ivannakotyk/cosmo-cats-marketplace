databaseChangeLog:
  - changeSet:
      id: lab-3-3
      author: ivanka
      changes:
        - addUniqueConstraint:
            tableName: products
            columnNames: category_id, name
            constraintName: uq_product_name_per_category

        - createIndex:
            tableName: products
            indexName: idx_product_name
            columns:
              - column:
                  name: name

        - createIndex:
            tableName: orders
            indexName: idx_order_status
            columns:
              - column:
                  name: status