server:
  port: 0

spring:
  application:
    name: space-cats-market-test

  liquibase:
    enabled: true
    change-log: classpath:liquibase/db.changelog-master.yaml

  jpa:
    show-sql: true
    properties:
      hibernate:
        ddl-auto: validate
    open-in-view: false

  docker:
    compose:
      enabled: false

clients:
  rates:
    base-url: http://localhost:8089

application:
  feature:
    toggles:
      cosmo-cats: true
      kitty-products: true