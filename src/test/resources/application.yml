server:
  port: 0

spring:
  application:
    name: space-cats-market-test

  liquibase:
    enabled: true
    change-log: classpath:liquibase/db.changelog-master.yaml

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate

  docker:
    compose:
      enabled: false

clients:
  rates:
    base-url: http://localhost:8089

application:
  feature:
    toggles:
      cosmo-cats: true
      kitty-products: true

security:
  api-key-header: X-API-KEY
  api-key: cosmo-cats-api-key
  jwt:
    secret: v3ry-l0ng-s3cr3t-k3y-f0r-hmac-sha256-algorithm-test-key
    jws-algorithm: HS256
    roles-claim: roles
